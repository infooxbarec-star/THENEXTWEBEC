<!doctype html>
<html lang="es-EC"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evaluar mi web | José Guerrero</title><meta name="description" content="Una evaluación breve para identificar oportunidades de claridad, confianza y conversión en tu web."><meta name="robots" content="index, follow"><link rel="canonical" href="https://thenextwebec.com/evaluar-mi-web.html"><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>:root{--ink:#f6f3ec;--muted:#b8c1d1;--navy:#071b44;--deep:#04132f;--gold:#c8a96b;--line:rgba(246,243,236,.16)}*{box-sizing:border-box}body{margin:0;background:var(--deep);color:var(--ink);font:16px Arial,sans-serif;line-height:1.5}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{padding:24px 0;border-bottom:1px solid var(--line)}header a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:bold}main{padding:72px 0}h1{font-size:clamp(40px,7vw,66px);letter-spacing:-.06em;line-height:1;margin:0}p{color:var(--muted)}.k{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.card{margin-top:36px;padding:26px;background:#071b44;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:grid;gap:7px;font-size:13px;font-weight:bold}input{padding:12px;background:#04132f;border:1px solid var(--line);color:var(--ink);font:inherit}.question{padding:21px 0;border-top:1px solid var(--line)}.question:first-of-type{border-top:0}.question legend{font-weight:bold}.choices{display:flex;gap:9px;margin-top:10px}.choices label{display:flex;gap:6px;align-items:center;font-weight:normal}.button{margin-top:22px;padding:13px 17px;background:var(--gold);border:0;color:#071b44;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.result{display:none;margin-top:20px;padding:18px;border:1px solid var(--gold);color:var(--ink)}.result.show{display:block}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:48px 0}}</style></head><body><header><div class="wrap"><a href="index.html">← José Guerrero · NextWebEC</a></div></header><main><div class="wrap"><p class="k">Evaluar mi web</p><h1>Revisa si tu web está ayudando a tu negocio.</h1><p>Responde estas diez preguntas. Al final recibirás una orientación y podrás compartirla directamente por WhatsApp.</p><form class="card" id="check"><div class="grid"><label>Nombre<input name="nombre" autocomplete="name" required></label><label>WhatsApp<input name="telefono" type="tel" autocomplete="tel" required></label><label style="grid-column:1/-1">Web actual<input name="web" type="url" placeholder="https://"></label></div><div id="questions"></div><button class="button" type="submit">Ver mi evaluación</button><div class="result" id="result" aria-live="polite"></div></form></div></main><script>const qs=['¿Tu visitante entiende qué vendes en menos de cinco segundos?','¿Tienes botones claros para WhatsApp o contacto?','¿La web guía al cliente hacia una acción específica?','¿Tu web actual te genera consultas de forma constante?','¿Tus servicios están explicados con claridad?','¿Las imágenes transmiten el nivel real de tu empresa?','¿Tu sitio se ve bien y carga con rapidez en celular?','¿Puedes actualizar información importante sin complicaciones?','¿Tu web muestra por qué elegirte frente a otras opciones?','¿La información de contacto es fácil de encontrar?'];const q=document.getElementById('questions');q.innerHTML=qs.map((x,i)=>`<fieldset class="question"><legend>${x}</legend><div class="choices"><label><input required type="radio" name="q${i}" value="si"> Sí</label><label><input required type="radio" name="q${i}" value="no"> No</label></div></fieldset>`).join('');document.getElementById('check').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),no=qs.filter((_,i)=>d.get('q'+i)==='no').length;const rec=no<=2?'Tu web tiene una base saludable. Conviene revisar mejoras puntuales y mantenerla activa.':no<=5?'Hay oportunidades claras. Un rediseño puede mejorar claridad, confianza y conversión.':'Tu presencia digital necesita atención. Conviene revisar una nueva estructura o un rediseño profundo.';const result=document.getElementById('result');result.classList.add('show');result.innerHTML=`<strong>${rec}</strong><p>Resultado: ${10-no}/10 respuestas favorables.</p><a class="button" href="https://wa.me/593969349833?text=${encodeURIComponent(`Hola José, hice la evaluación de mi web.\nNombre: ${d.get('nombre')}\nWeb: ${d.get('web')||'No indicada'}\nResultado: ${10-no}/10\nOrientación: ${rec}`)}" target="_blank" rel="noopener">Compartir por WhatsApp</a>`})</script></body></html>
