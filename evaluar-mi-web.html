<!doctype html>
<html lang="es-EC">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluar mi web | NextWebEC</title>
  <meta name="description" content="Una evaluación breve para identificar oportunidades de claridad, confianza y conversión en tu web.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="canonical" href="https://thenextwebec.com/evaluar-mi-web.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{--navy:#071b44;--blue:#0b5cff;--ink:#111318;--muted:#5e6470;--line:#e7e9ed;--soft:#f7f8fa}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:16px/1.5 Inter,Manrope,"Helvetica Neue",Arial,sans-serif}.wrap{width:min(790px,calc(100% - 40px));margin:auto}header{border-bottom:1px solid var(--line)}header .wrap{display:flex;align-items:center;min-height:72px}header a{color:var(--navy);font-size:14px;font-weight:750;text-decoration:none;letter-spacing:.03em}main{padding:88px 0 116px}.eyebrow{margin:0 0 17px;color:var(--blue);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{max-width:680px;margin:0;font-size:clamp(2.7rem,6vw,4.65rem);font-weight:600;letter-spacing:-.065em;line-height:.98}main>div>p:not(.eyebrow){max-width:620px;margin:22px 0 0;color:var(--muted);font-size:18px}.card{margin-top:40px;padding:clamp(22px,5vw,42px);border:1px solid var(--line);border-radius:14px;background:var(--soft)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}.field{display:grid;gap:8px}.field:last-child{grid-column:1/-1}label{font-size:13px;font-weight:650}input{width:100%;padding:12px 0;border:0;border-bottom:1px solid #bfc6d1;border-radius:0;background:transparent;color:var(--ink);font:inherit}input:focus{outline:0;border-color:var(--blue);box-shadow:0 2px 0 var(--blue)}#questions{margin-top:32px;border-top:1px solid var(--line)}fieldset{min-width:0;margin:0;padding:22px 0;border:0;border-bottom:1px solid var(--line)}legend{max-width:600px;padding:0;font-weight:600}.choices{display:flex;gap:18px;margin-top:13px}.choices label{display:flex;gap:7px;align-items:center;font-weight:400}.choices input{width:17px;height:17px;margin:0;accent-color:var(--blue)}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:28px;padding:12px 18px;border:1px solid var(--navy);border-radius:10px;background:var(--navy);color:#fff;font:650 14px/1 inherit;cursor:pointer;text-decoration:none}.button:hover{background:#0b2a62}.result{display:none;margin-top:24px;padding:20px;border:1px solid #bad0ff;border-radius:10px;background:#fff}.result.show{display:block}.result p{margin:8px 0 0;color:var(--muted)}.result .button{margin-top:16px}input:focus-visible,.button:focus-visible{outline:3px solid rgba(11,92,255,.3);outline-offset:3px}@media(max-width:600px){main{padding:56px 0 76px}.grid{grid-template-columns:1fr}.field:last-child{grid-column:auto}.choices{gap:14px}.button{width:100%}}
  </style>
</head>
<body>
  <header><div class="wrap"><a href="index.html">← NEXTWEBEC</a></div></header>
  <main><div class="wrap"><p class="eyebrow">Evaluar mi web</p><h1>Revisa si tu web está ayudando a tu negocio.</h1><p>Responde estas diez preguntas. Al final recibirás una orientación y podrás compartirla directamente por WhatsApp.</p><form class="card" id="check"><div class="grid"><div class="field"><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="name" required></div><div class="field"><label for="telefono">WhatsApp</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" required></div><div class="field"><label for="web">Web actual</label><input id="web" name="web" type="url" placeholder="https://"></div></div><div id="questions"></div><button class="button" type="submit">Ver mi evaluación</button><div class="result" id="result" aria-live="polite"></div></form></div></main>
  <script>
    const questions=['¿Tu visitante entiende qué vendes en menos de cinco segundos?','¿Tienes botones claros para WhatsApp o contacto?','¿La web guía al cliente hacia una acción específica?','¿Tu web actual te genera consultas de forma constante?','¿Tus servicios están explicados con claridad?','¿Las imágenes transmiten el nivel real de tu empresa?','¿Tu sitio se ve bien y carga con rapidez en celular?','¿Puedes actualizar información importante sin complicaciones?','¿Tu web muestra por qué elegirte frente a otras opciones?','¿La información de contacto es fácil de encontrar?'];
    const questionsNode=document.getElementById('questions');
    questionsNode.innerHTML=questions.map((question,index)=>`<fieldset><legend>${question}</legend><div class="choices"><label><input required type="radio" name="q${index}" value="si"> Sí</label><label><input required type="radio" name="q${index}" value="no"> No</label></div></fieldset>`).join('');
    document.getElementById('check').addEventListener('submit',(event)=>{
      event.preventDefault();const data=new FormData(event.currentTarget);const no=questions.filter((_,index)=>data.get('q'+index)==='no').length;
      const recommendation=no<=2?'Tu web tiene una base saludable. Conviene revisar mejoras puntuales y mantenerla activa.':no<=5?'Hay oportunidades claras. Un rediseño puede mejorar claridad, confianza y conversión.':'Tu presencia digital necesita atención. Conviene revisar una nueva estructura o un rediseño profundo.';
      const result=document.getElementById('result');result.classList.add('show');const text=`Hola José, hice la evaluación de mi web.\nNombre: ${data.get('nombre')}\nWeb: ${data.get('web')||'No indicada'}\nResultado: ${10-no}/10\nOrientación: ${recommendation}`;
      result.innerHTML=`<strong>${recommendation}</strong><p>Resultado: ${10-no}/10 respuestas favorables.</p><a class="button" href="https://wa.me/593969349833?text=${encodeURIComponent(text)}" target="_blank" rel="noopener noreferrer">Compartir por WhatsApp</a>`;
    });
  </script>
</body>
</html>
